name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 层 0 叶子仓：零工作区兄弟仓依赖（ProjectReference 全在本仓内；MAF/MEAI/FCS/OTel 均公共 NuGet）
      # ——无须兄弟仓 checkout（切 PackageReference 后亦无须变更）
      - uses: actions/checkout@v4
        with:
          path: aether-ai
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile aether-ai/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Build
        run: dotnet build aether-ai.slnx -c Release
        working-directory: aether-ai

      # 测试按被测项目拆分：Core / Brains.Abstractions / Brains.Rule{,.RulesEngine,.NRules} /
      # Brains.Code{,.Compilation} / Brains.Routing / Brains.Llm / Harness / Hosting / Mcp / Memory 共 13 个程序集。
      # 零真实模型调用（LLM 路径用脚本化 IChatClient 替身）、零真实 MCP 连接（只测配置与失败隔离）；
      # 代码大脑的编译用例走仓内 Roslyn/FCS，不访问外部端点。
      - name: Test
        run: dotnet test aether-ai.slnx -c Release --no-build
        working-directory: aether-ai

      - name: Run dependency consumers
        run: |
          dotnet run --project tests/Consumers/Aether.AI.RuleOnly.Consumer -c Release --no-build
          dotnet run --project tests/Consumers/Aether.AI.PrecompiledCode.Consumer -c Release --no-build
          dotnet run --project tests/Consumers/Aether.AI.CSharpCompilation.Consumer -c Release --no-build
          # 同一宿主里跑全部大脑：program / rulesEngine / nRules / Code / LLM（脚本化，无 key）
          dotnet run --project tests/Consumers/Aether.AI.BrainMatrix.Consumer -c Release --no-build
        working-directory: aether-ai
